name: Web Test Yayini
on:
  push:
    branches:
      - main 
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Al
        uses: actions/checkout@v3
      - name: Flutter Kur
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Web Icin Derle
        run: flutter build web --release --base-href /ranpro/
      - name: GitHub Pages'e Yukle
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          
