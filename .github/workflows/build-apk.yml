name: Build RANPRO APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlari Cek
        uses: actions/checkout@v4

      - name: Flutter Kur
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flutter Projesi Olustur
        run: flutter create --project-name ranpro --org com.ranpro.app .

      - name: Bagimliliklari Getir
        run: flutter pub get

      - name: APK Derle
        run: flutter build apk --release

      - name: APK Yukle
        uses: actions/upload-artifact@v4
        with:
          name: ranpro-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk